name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: nphunter-site
  CLOUDFRONT_DISTRIBUTION_ID: E4B5P9MJTIMYQ

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Test backend authorization
        run: node --test tests/backend/*.test.mjs

      - name: Test static homepage
        run: npm run test:e2e

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          mkdir -p /tmp/nphunter-public
          cp index.html history.html privacy.html language.js projects.js account.js account.css history.js history-language.js /tmp/nphunter-public/
          cp -R assets locales /tmp/nphunter-public/
          aws s3 sync /tmp/nphunter-public/ "s3://${S3_BUCKET}/" --delete \
            --cache-control "no-cache, max-age=0, must-revalidate"

      # s3 sync does not update metadata when the file contents are unchanged.
      - name: Require homepage revalidation in browsers
        run: |
          aws s3 cp index.html "s3://${S3_BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"

      - name: Smoke Test
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 "https://d6y918unhwjl9.cloudfront.net/")
          echo "CloudFront status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test FAILED: expected 200, got $STATUS"
            exit 1
          fi
          echo "Smoke test PASSED"

      - name: Verify public homepage entries
        run: npm run test:e2e
        env:
          NPHUNTER_SITE_BASE_URL: https://nphunter.gg
          NPHUNTER_SITE_VERIFY_TARGETS: "1"
