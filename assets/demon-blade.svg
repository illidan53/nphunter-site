      <use href="#foe" x="378" y="108" width="30" height="33"/>
      <use href="#foe" x="404" y="102" width="30" height="33"/>
      <path d="M396 106V74l20 6-20 8" stroke="#231d1a" stroke-width="2" stroke-linejoin="round"/>
    </g>
